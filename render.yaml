services:
  - type: web
    name: tallador-de-suenos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tallador-de-suenos-db
          property: connectionString

databases:
  - name: tallador-de-suenos-db
    plan: free
    databaseName: tallador_de_suenos
    user: tallador_user
